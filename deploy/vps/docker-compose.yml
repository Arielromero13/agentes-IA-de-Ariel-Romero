# Stack de instalación para un VPS nuevo, basado en la opción oficial Docker + Hermes de DeskRPG.
services:
  deskrpg:
    image: ${DESKRPG_IMAGE:-ghcr.io/dandacompany/deskrpg:2026.1019.1}
    restart: unless-stopped
    depends_on: [hermes]
    ports:
      - "127.0.0.1:3102:3000"
      - "127.0.0.1:3103:3001"
    environment:
      DB_TYPE: sqlite
      SQLITE_PATH: /app/data/deskrpg.db
      DESKRPG_HOME: /app/data/home
      JWT_SECRET: ${JWT_SECRET:?genera JWT_SECRET}
      COOKIE_SECURE: "true"
      INTERNAL_HOSTNAME: 0.0.0.0
    volumes: [deskrpg-data:/app/data]

  plugin-pin:
    image: ${DESKRPG_IMAGE:-ghcr.io/dandacompany/deskrpg:2026.1019.1}
    restart: "no"
    user: root
    entrypoint: ["sh", "-c"]
    command:
      - sed -n 's/^export const PLUGIN_PIN = "\([0-9a-f]\{40\}\)";$$/\1/p' src/lib/hermes/setup/pin.ts > /pin/ref
    volumes: [plugin-pin:/pin]

  hermes-plugins:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v0.23.3}
    restart: "no"
    depends_on:
      plugin-pin:
        condition: service_completed_successfully
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      API_SERVER_KEY: ${HERMES_API_KEY:?genera HERMES_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?define OPENROUTER_API_KEY}
    volumes:
      - hermes-data:/opt/data
      - plugin-pin:/pin:ro
    command:
      - sh
      - -c
      - |
        set -e
        touch /opt/data/.env
        grep -v '^OPENROUTER_API_KEY=' /opt/data/.env > /tmp/env.next || true
        printf 'OPENROUTER_API_KEY=%s\n' "$$OPENROUTER_API_KEY" >> /tmp/env.next
        cat /tmp/env.next > /opt/data/.env
        chmod 600 /opt/data/.env
        u=https://github.com/dandacompany/deskrpg-hermes-plugin
        d=/opt/data/plugins/deskrpg
        p="hermes plugins"
        pin=$$(cat /pin/ref 2>/dev/null || true)
        h=$$(git -c safe.directory='*' -C "$$d" rev-parse HEAD 2>/dev/null || true)
        if [ -z "$$pin" ]; then
          echo "No se pudo leer el commit compatible del plugin." >&2
          exit 1
        fi
        if [ "$$h" != "$$pin" ]; then
          $$p disable deskrpg || true
          $$p install "$$u" --ref "$$pin" --force --no-enable || [ -d "$$d" ]
        elif [ ! -d "$$d" ]; then
          $$p install "$$u" --ref "$$pin" --no-enable
        fi
        $$p enable deskrpg
        hermes config set image_gen.provider openrouter
        hermes config set image_gen.model google/gemini-nano-banana-2.1

  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v0.23.3}
    restart: unless-stopped
    command: ["gateway", "run"]
    depends_on:
      hermes-plugins:
        condition: service_completed_successfully
      plugin-pin:
        condition: service_completed_successfully
        restart: true
    ports: ["127.0.0.1:9119:9119"]
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_KEY:?genera HERMES_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?define OPENROUTER_API_KEY}
      HERMES_DASHBOARD: ${HERMES_DASHBOARD_PASSWORD:+true}
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: admin
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD:-}
      HERMES_DASHBOARD_PUBLIC_URL: http://localhost:9119
    volumes: [hermes-data:/opt/data]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?define el dominio del VPS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  deskrpg-data:
  hermes-data:
  plugin-pin:
  caddy-data:
  caddy-config:
